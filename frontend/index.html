<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DEWS · Dengue Early Warning System</title>
    <meta
      name="description"
      content="Forecasts, credible intervals and comparative evaluation for the Bayesian-neural hybrid dengue prediction model."
    />
    <meta name="color-scheme" content="light dark" />

    <!-- Inline so there is no favicon request (and no 404 when none is served). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300887A'/%3E%3Cg fill='none' stroke='white' stroke-width='2.2'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Ccircle cx='16' cy='16' r='4'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='1.6' fill='white'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Stamp the resolved theme before first paint so a dark-mode load never
         flashes the light palette. ThemeProvider takes over from here. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dews_theme')
          var dark = saved === 'dark' ||
            ((!saved || saved === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          /* private mode: fall back to the CSS media query */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
